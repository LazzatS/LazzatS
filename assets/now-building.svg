<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="Now building: Chess App, an iOS app that brings admins, coaches, parents and students into one place. One move at a time.">
<style>
  .label { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a7f37; letter-spacing: 1px; }
  .dot { fill: #1a7f37; animation: pulse 1.2s steps(2) infinite; }
  .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .body { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #424a53; }
  .muted { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
  .track { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 2; }
  .bar { fill: #1a7f37; animation: grow 6s steps(14) infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @keyframes grow { from { width: 24px; } to { width: 200px; } }
  @media (prefers-color-scheme: dark) {
    .label, .dot, .bar { fill: #39d353; }
    .title { fill: #e6edf3; }
    .body { fill: #c9d1d9; }
    .muted { fill: #8b949e; }
    .track { fill: #161b22; stroke: #30363d; }
  }
</style>
<rect class="dot" x="2" y="14" width="9" height="9"/>
<text class="label" x="20" y="23">NOW BUILDING</text>
<text class="title" x="2" y="66">Chess App</text>
<text class="body" x="2" y="102">An iOS app that brings admins, coaches,</text>
<text class="body" x="2" y="126">parents and students into one place.</text>
<rect class="track" x="2" y="148" width="320" height="12"/>
<rect class="bar" x="3" y="149" width="24" height="10"/>
<text class="muted" x="2" y="186">one move at a time</text>
</svg>
